apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-api-staging

resources:
  - ../../base

images:
  - name: registry.example.com/sample-api
    newTag: staging-rc

replicas:
  - name: sample-api
    count: 2

patches:
  - target:
      kind: Deployment
      name: sample-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: info
