# Argo CD Application â deployed once per environment by changing `path` and `namespace`
# below (or templated via an ApplicationSet in a real multi-env rollout). Shown here for the
# production environment as the reference example.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/example-org/gitops-deployment-reference.git
    targetRevision: main
    path: overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
