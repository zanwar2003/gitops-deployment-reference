# Declares WHICH secret to sync and under what name. This resource creates a native Kubernetes
# Secret (`sample-api-secrets`, referenced by base/deployment.yaml's envFrom) whose values are
# populated from the SecretStore above and kept in sync on the refreshInterval â the values
# themselves are never written to Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-api-secrets
  namespace: sample-api-production
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: sample-api-secret-store
    kind: SecretStore
  target:
    name: sample-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sample-api-database-url
    - secretKey: API_SIGNING_KEY
      remoteRef:
        key: sample-api-signing-key
