# Declares WHERE secret values live. No secret values appear in this repo â only the wiring
# that tells External Secrets Operator which backend and identity to use to fetch them.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: sample-api-secret-store
  namespace: sample-api-production
spec:
  provider:
    azurekv:
      vaultUrl: "https://example-keyvault.vault.azure.net"
      authType: ManagedIdentity
      identityId: "<managed-identity-client-id>"
